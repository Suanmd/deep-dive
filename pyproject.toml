[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-dive"
version = "1.0.0"
description = "Deep research engine: dual-engine multi-perspective parallel search + multi-language expansion + site targeting + full-text scraping (Playwright + cloudscraper fallback) + cookie injection + deduplication aggregation + structured Markdown report output"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Suanmd" },
]
keywords = [
    "deep-research", "search-engine", "web-crawler",
    "playwright", "tavily", "mmx",
    "multi-language", "markdown-report",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "trafilatura>=1.6.0",
    "tavily-python>=0.3.0",
    "playwright>=1.40.0",
    "cloudscraper>=1.2.71",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Documentation = "https://github.com/Suanmd/deep-dive/tree/main/docs"
Issues = "https://github.com/Suanmd/deep-dive/issues"
Homepage = "https://github.com/Suanmd/deep-dive"

[project.scripts]
deep-dive = "deep_dive.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deep_dive*"]

[tool.setuptools.package-data]
deep_dive = ["py.typed", "config/*.yaml"]

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that exercise multiple modules together",
    "network: marks tests that hit the network (deselect with '-m \"not network\"')",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:trafilatura.*",
    "ignore::DeprecationWarning:playwright.*",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "build", "dist", "scripts/__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in default argument (common for Optional[Config])
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
ignore_missing_imports = true
files = ["src/deep_dive"]

# `deep_dive.logging_setup` calls `ctypes.windll` inside an
# `if os.name == "nt":` block to detect the Windows console codepage.
# `ctypes.windll` only exists in the typeshed on Windows, so on
# Linux/macOS CI runners mypy emits `attr-defined`. We need the
# `# type: ignore[attr-defined]` comment on that line for Linux CI,
# but on Windows local dev the attribute IS in the typeshed and
# mypy would then warn `unused-ignore`. Suppress unused-ignore
# warnings for this module only — the type-ignore is platform-gated
# by design and is not actually dead.
[[tool.mypy.overrides]]
module = "deep_dive.logging_setup"
warn_unused_ignores = false

# ---------------------------------------------------------------------------
# Bandit (security linter)
# ---------------------------------------------------------------------------
# B112 (try_except_continue) is intentionally used throughout the
# crawler pipeline to skip individual bad files / dead URLs / partial
# reads without aborting the whole task. This is a legitimate
# resilience pattern for fetch-heavy code, not a real bug. Suppress
# project-wide; if a future refactor introduces a real exception
# swallowing bug, prefer # nosec B112 + log.warning() over removal.
# B324 (weak SHA1) is silenced inline via usedforsecurity=False on the
# one call site that uses SHA1 for non-cryptographic content hashing.
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
# B112 (try_except_continue): legitimate resilience pattern in the
#         crawler pipeline — skip individual bad files / dead URLs
#         without aborting the whole task. Use # nosec B112 + log.warning()
#         rather than removal if a real exception-swallowing bug surfaces.
# B110 (try_except_pass): same rationale as B112 — encoding detection
#         and playwright warm-up failures are non-fatal by design.
# B311 (random for security): random.choice / random.uniform are used
#         for user-agent rotation and crawl-pacing jitter, NOT for
#         security. Crawler fingerprinting requires unpredictability,
#         not cryptographic strength. Use `secrets` only if we ever
#         need to mint tokens / API keys.
# B404 (subprocess): mmx.py invokes the mmx CLI as a subprocess by
#         design — there's no in-process alternative. Input comes
#         from the user-supplied query and engine config; both are
#         sanitized at the orchestrator boundary.
# B603 (subprocess without shell): the mmx subprocess call is invoked
#         with a list, not a shell string, so this is a false positive.
#         bandit doesn't always detect list-form calls correctly.
skips = ["B112", "B110", "B311", "B404", "B603"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/deep_dive"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
