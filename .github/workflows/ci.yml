name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint: ruff check + ruff format
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: ruff check
        run: ruff check src/

      - name: ruff format --check
        run: ruff format --check src/

  # ---------------------------------------------------------------------------
  # Type check: mypy --strict on src/deep_dive
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + mypy
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "mypy==1.11.2"

      - name: mypy
        run: mypy src/deep_dive --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Security: bandit + pip-audit
  # ---------------------------------------------------------------------------
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + security tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "bandit==1.7.10" "pip-audit==2.7.3"

      - name: bandit
        run: bandit -r src/deep_dive -c pyproject.toml

      - name: pip-audit
        # Audit only requirements.txt (skip the editable project itself).
        # --no-deps + --strict is the supported CI invocation per
        # pip-audit 2.7+ docs.
        run: pip-audit -r requirements.txt --no-deps --strict

  # ---------------------------------------------------------------------------
  # Test: pytest (full suite, no -x early-exit)
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: pytest tests/ -v --tb=short